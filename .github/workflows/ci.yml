name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test
        env:
          # Same placeholder as the build below, for the same reason: a test
          # that reaches a module importing session.ts would otherwise fail on
          # a missing secret rather than on anything it set out to check.
          SESSION_SECRET: ci-build-placeholder-not-a-real-secret

      - name: Build
        run: npm run build
        env:
          # Build-time only. session.ts requires SESSION_SECRET to be set
          # (it refuses to sign cookies with a default), and Next.js imports
          # every API route while collecting page data during `next build`,
          # so this needs a value even though nothing is actually served.
          # Real deployments must set their own SESSION_SECRET - this is not
          # it, and does not need to be a repo secret.
          SESSION_SECRET: ci-build-placeholder-not-a-real-secret
